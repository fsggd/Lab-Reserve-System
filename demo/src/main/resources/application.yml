server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: lab-reserve-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lab_reserve?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: root
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  # 自定义 SQL 的 XML 位置（BaseMapper 自带 CRUD 不需要 XML）
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: backend.demo.entity
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线建议去掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键自增
      id-type: auto
      # 逻辑删除：实体里需要有 deleted 字段（或用 @TableLogic 标注）才会生效
      # logic-delete-field: deleted
      # logic-delete-value: 1
      # logic-not-delete-value: 0

logging:
  level:
    backend.demo: debug
