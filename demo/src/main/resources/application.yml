server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: lab-reserve-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lab_reserve?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: root
  jackson:
    time-zone: Asia/Shanghai
  sql:
    init:
      # 启动时自动建表（schema.sql 用了 IF NOT EXISTS，可重复执行）
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# JWT 配置
jwt:
  secret: lab-reserve-system-jwt-secret-key-please-change-this-2026
  expiration: 86400000   # 24 小时（毫秒）

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: backend.demo.entity
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线建议去掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    backend.demo: debug
